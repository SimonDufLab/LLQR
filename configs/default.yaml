batch_size: 128
learning_rate: 0.1
momentum: 0.9
main_optimizer: sgd
weight_decay: null
total_epochs: 250 # used to be total_steps: 97656
test_eval_freq: 2000
checkpoint_freq: 1000 # Snapshot of model and training for preemption handling
logging_freq: 10 # Base logging freq for training losses etc. with aim
report_freq: 200 # Frequency (in steps) at which current training progress is reported in CLI
init_key: 42
rng_seed: 123 # For dropout, etc.

update_preconditioner_every: 1000
precond_steps: 50
precond_batch_size: 64
precond_lr: 0.001
precond_solver: momentum
precond_on_update: false
precond_clip_norm: 5.0
normalize_grad_for_lqr: true
normalize_conv_params: false
use_preconditioner: true

divergence: ngd
divergence_order_param: 0.5
block_structure: diagonal
block_structure_init: identity
multibatch_training: false
damping: 0.0

# Cluster options
preempt_handling: false
jobid: null  # To manually restart a previous job
