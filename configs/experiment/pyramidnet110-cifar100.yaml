# @package _global_
defaults:
  - /default
  - /architecture: pyramidnet110
  - /dataset: cifar100
  - /lr_scheduler: cosine_annealing
  - /precond_lr_scheduler: constant
  - /ema_scheduler: constant
  - /precond_update_scheduler: constant

batch_size: 128
learning_rate: 0.05
momentum: 0.9
main_optimizer: polyak
weight_decay: 5e-4
total_epochs: 200
test_eval_freq: 2000
checkpoint_freq: 1000
init_key: 42
rng_seed: 123

precond_batch_size: 128
