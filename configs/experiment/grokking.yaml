# @package _global_
defaults:
  - /default        # includes default.yaml from default/
  - /architecture: grok_transformer
  - /dataset: grok_mod_sum
  - /lr_scheduler: step_warmup
  - /precond_lr_scheduler: constant

batch_size: 512
learning_rate: 1e-3
momentum: 0.9
main_optimizer: adamw_b2-98
weight_decay: 0
total_epochs: 6050
test_eval_freq: 1000
checkpoint_freq: 2500
logging_freq: 250 # Base logging freq for training losses etc. with aim
report_freq: 2000 # Frequency (in steps) at which current training progress is reported in CLI
init_key: 42
rng_seed: 123 # For dropout, etc.

precond_batch_size: 512
update_preconditioner_every: 2500