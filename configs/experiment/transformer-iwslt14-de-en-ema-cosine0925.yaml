# @package _global_
defaults:
  - /default
  - /architecture: transformer_iwslt_de_en
  - /dataset: iwslt14_de_en
  - /lr_scheduler: inverse_sqrt
  - /precond_lr_scheduler: constant
  - /ema_scheduler: cosine_annealing
  - /precond_update_scheduler: constant

batch_size: 128
grad_acc_steps: 1
eval_batch_size: 128
learning_rate: 5e-4
main_optimizer: adamw
adam_betas: [0.9, 0.98]
weight_decay: 1e-4
total_epochs: 133
label_smoothing: 0.1
test_eval_freq: 1000
checkpoint_freq: 1000
init_key: 42
rng_seed: 123
start_sam_after_step: 4000
ema_decay: 0.8

architecture:
  dropout: 0.3

dataset:
  max_tokens: 16384

precond_batch_size: 48
update_preconditioner_every: 1000
use_preconditioner: true
batch_solve_precond: true
llqr_batch_update_mode: full_batch

translation_eval:
  enabled: true
  freq: 10000
  max_examples: 256
  full_eval_at_end: true
  full_eval_freq: 15000
  progress_freq: 64
  beam_size: 5
  max_len_a: 1.2
  max_len_b: 10
  remove_bpe: "@@ "
  detok: moses
  print_samples: true
  checkpoint_metric: bleu
  maximize_checkpoint_metric: true
