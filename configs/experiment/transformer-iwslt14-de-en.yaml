# @package _global_
defaults:
  - /default
  - /architecture: transformer_iwslt_de_en
  - /dataset: iwslt14_de_en
  - /lr_scheduler: inverse_sqrt
  - /precond_lr_scheduler: constant
  - /ema_scheduler: constant
  - /precond_update_scheduler: constant

batch_size: 128
grad_acc_steps: 1
eval_batch_size: 128
learning_rate: 5e-4
main_optimizer: adam
adam_betas: [0.9, 0.98]
weight_decay: 1e-4
total_epochs: 55
label_smoothing: 0.1
test_eval_freq: 1000
checkpoint_freq: 1000
init_key: 42
rng_seed: 123

architecture.dropout: 0.3

dataset.max_tokens: 4096

precond_batch_size: 64
update_preconditioner_every: 1000
use_preconditioner: true
batch_solve_precond: true
llqr_batch_update_mode: full_batch

translation_eval.enabled: true
translation_eval.beam_size: 5
translation_eval.max_len_a: 1.2
translation_eval.max_len_b: 10
translation_eval.remove_bpe: "@@ "
translation_eval.detok: moses
translation_eval.print_samples: true
translation_eval.checkpoint_metric: bleu
translation_eval.maximize_checkpoint_metric: true
