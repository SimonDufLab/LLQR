# @package _global_
defaults:
  - /default
  - /architecture: vit_ti16
  - /dataset: cifar100
  - /lr_scheduler: warmup_cosine_decay
  - /precond_lr_scheduler: constant
  - /ema_scheduler: constant
  - /precond_update_scheduler: constant

batch_size: 256
learning_rate: 1e-3
main_optimizer: adamw
weight_decay: 0.3
wd_mask: ['Norm', 'bias']
total_epochs: 300
label_smoothing: 0.1
test_eval_freq: 2000
checkpoint_freq: 1000
init_key: 42
rng_seed: 123

precond_batch_size: 256

lr_scheduler:
  t_max: 300
